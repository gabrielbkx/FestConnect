spring.application.name=festconnect
spring.profiles.active=dev
spring.liquibase.change-log=classpath:/liquibase/base-changelog.xml

festconnect.pedido.prazo-resposta-horas=72

# Admin inicial (ver CriarAdmin). Sem as variaveis, nenhum admin e criado;
# com senha menor que 12 caracteres, a aplicacao nao sobe.
festconnect.admin.email=${ADMIN_EMAIL:}
festconnect.admin.senha=${ADMIN_SENHA:}

# Origens que podem chamar a API pelo navegador (CORS). Lista separada por virgula.
# Padrao: so o frontend do ambiente (app.frontend.url).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${app.frontend.url}}

# Pronto para receber visitas = processo de pe + banco no ar. O Redis fica de fora de proposito:
# sem ele, o login so perde o limite de tentativas.
management.endpoint.health.group.readiness.include=readinessState,db

# Se o Redis nao responder em 2 s, desiste. O padrao do Lettuce e 1 minuto.
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
