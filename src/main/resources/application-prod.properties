# Prod Profile Configuration

# PostgreSQL Database Connection
spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Storage de midias: S3 da AWS por padrao, ou outro compativel (ex.: Cloudflare R2) via STORAGE_ENDPOINT.
# Sem STORAGE_ACCESS_KEY, usa as credenciais padrao da AWS (papel da maquina).
storage.s3.endpoint=${STORAGE_ENDPOINT:}
storage.s3.region=${STORAGE_REGION:sa-east-1}
storage.s3.bucket=${STORAGE_BUCKET:${BUCKET_NAME_S3}}
storage.s3.access-key=${STORAGE_ACCESS_KEY:}
storage.s3.secret-key=${STORAGE_SECRET_KEY:}
storage.url-publica=${STORAGE_URL_PUBLICA:https://${storage.s3.bucket}.s3.amazonaws.com}

# Upload de midias
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

management.endpoints.web.exposure.include=health,info

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

api.security.token.secret=${SECRET_KEY_TOKEN}

# Configuracoes de email
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Configuracoes do Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# URL do frontend (usada nos redirecionamentos OAuth2)
app.frontend.url=${APP_FRONTEND_URL}

# Respeita o header X-Forwarded-Proto do Nginx para montar URLs com https
server.forward-headers-strategy=framework

# Redis do limite de tentativas. Sem ele no ar, o login segue pelo plano B (contagem na memoria).
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
