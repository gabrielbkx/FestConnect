services:

  postgres_db:
    image: postgres:17
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fest_connect_network

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger
    restart: always
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - fest_connect_network

  backend_api_fest_connect:
    build:
      context: .
    container_name: api-fest-connect
    ports:
      - "8080:8080"
    env_file:
      - ".env"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - OTEL_SERVICE_NAME=festconnect-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    depends_on:
      postgres_db:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - fest_connect_network

  # Storage de fotos e vídeos compatível com S3 (substitui o S3 da AWS em dev).
  # Subir só ele: docker compose up -d seaweedfs
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: seaweedfs
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/festconnect/entrypoint.sh"]
    ports:
      - "8333:8333" # API S3 (a aplicação grava aqui e o navegador lê as mídias daqui)
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-festconnect-midias}
    volumes:
      - seaweedfs_data:/data
      - ./infra/seaweedfs/entrypoint.sh:/festconnect/entrypoint.sh:ro
    networks:
      - fest_connect_network

  # Contador de tentativas de login (e, depois, tokens revogados e cache).
  # Subir só ele: docker compose up -d redis
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379" # só esta máquina: o Redis roda sem senha
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - fest_connect_network

networks:
  fest_connect_network:
    driver: bridge

volumes:
  postgres_data:
  seaweedfs_data:
