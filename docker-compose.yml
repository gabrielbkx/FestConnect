services:

  postgres_db:
    image: postgres:17
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    networks:
      - fest_connect_network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    restart: always
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - fest_connect_network

  backend_api_fest_connect:
    build:
      context: .
    container_name: api-fest-connect
    ports:
      - "8080:8080"
    env_file:
      - ".env"
    depends_on:
      - postgres_db
      - jaeger
    networks:
      - fest_connect_network

  # --- perfil monitoring: subir apenas em desenvolvimento/observabilidade ---
  # uso: docker compose --profile monitoring up

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    profiles: [monitoring]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fest_connect_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    profiles: [monitoring]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - fest_connect_network

networks:
  fest_connect_network:
    driver: bridge
